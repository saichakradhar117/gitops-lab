apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saichakradhar117/gitops-lab.git
    targetRevision: main
    path: apps/webapp/overlays/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true